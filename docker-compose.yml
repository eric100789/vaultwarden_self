services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: "${DOMAIN}"
      TZ: "${TZ:-Asia/Taipei}"

      # 註冊 / 邀請控制
      SIGNUPS_ALLOWED: "${SIGNUPS_ALLOWED:-false}"
      INVITATIONS_ALLOWED: "${INVITATIONS_ALLOWED:-true}"
      SIGNUPS_VERIFY: "${SIGNUPS_VERIFY:-true}"

      # admin 後台（值必須是 argon2 雜湊，見 SETUP.md）
      ADMIN_TOKEN: "${ADMIN_TOKEN}"

      # SMTP（Gmail）
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURITY: "${SMTP_SECURITY:-starttls}"
      SMTP_USERNAME: "${SMTP_USERNAME}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      SMTP_FROM: "${SMTP_FROM}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-Vaultwarden}"
    volumes:
      - ./vw-data:/data
    ports:
      # 只綁 localhost，僅供伺服器本機除錯；對外流量全部走 Cloudflare Tunnel。
      # port 在 .env 的 VW_PORT 設定，跟其他服務打架就換一個數字。
      - "127.0.0.1:${VW_PORT:-8200}:80"
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
    labels:
      # 讓 watchtower 監控這個容器（見下方 watchtower 服務）
      - "com.centurylinklabs.watchtower.enable=true"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: vaultwarden-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      vaultwarden:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # 自動更新：compose up 時立刻檢查一次，之後每隔 WATCHTOWER_POLL_INTERVAL 秒
  # 再檢查一次；只要上面兩個容器有新版 image 就自動 pull + 重建，並清掉舊 image。
  # 只會動有標 com.centurylinklabs.watchtower.enable=true 的容器（--label-enable），
  # 不會連 watchtower 自己一起更新。
  watchtower:
    # 原版 containrrr/watchtower 已停止維護，內建 docker client 太舊，跟較新版
    # Docker Engine（要求 API >= 1.44）不相容，會一直噴 "client version 1.25 is
    # too old" 然後 restart loop。改用社群持續維護的 fork：nickfedor/watchtower。
    image: nickfedor/watchtower:latest
    container_name: vaultwarden-watchtower
    restart: unless-stopped
    environment:
      TZ: "${TZ:-Asia/Taipei}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - --label-enable
      - --cleanup
      - --interval
      - "${WATCHTOWER_POLL_INTERVAL:-86400}"
